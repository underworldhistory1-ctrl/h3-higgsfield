name: Build Salad image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile.salad
      - .dockerignore
      - deploy/salad/**
      - deploy/download_qwen_image_models.py
      - web/**
      - workflows/**
      - __init__.py
      - h3_video_save.py
      - qwen_image.py
      - tests/**
      - promptwriter.py
      - .github/workflows/salad-image.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free build disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af || true
      - name: Validate deployment files
        run: |
          bash -n deploy/salad/entrypoint.sh
          python -m pip install --disable-pip-version-check pillow
          python -m py_compile deploy/download_h3_models.py deploy/download_optional_loras.py deploy/download_qwen_image_models.py deploy/make_h3_landing.py
          python -m unittest discover -s tests -v
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.salad
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/minimax-h3-higgsfield:salad
            ghcr.io/${{ github.repository_owner }}/minimax-h3-higgsfield:salad-${{ github.sha }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
